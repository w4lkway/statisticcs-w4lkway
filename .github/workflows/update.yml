name: Update stats and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'config.json'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: node scripts/update.mjs

      - name: Commit updated data
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add site/data/stats.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Update stats"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
